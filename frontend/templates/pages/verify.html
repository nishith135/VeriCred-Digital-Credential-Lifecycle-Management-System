{% extends "base.html" %}

{% block title %}Verify Credential // VeriCred{% endblock %}

{% block content %}
<div class="space-y-6">
  <!-- Page Header -->
  <div class="pb-2 border-b border-border">
    <h1 class="text-2xl lg:text-3xl font-extrabold tracking-tight text-white">Public Credential Verification</h1>
    <p class="text-text-muted text-sm mt-1 max-w-2xl">
      Enter a credential ID to check that it is authentic, unaltered and not revoked.
    </p>
  </div>

  <!-- Verification Search Input Card -->
  <div class="veri-card p-6 md:p-8 bg-card shadow-xl" id="credentialSearchCard">
    <form hx-post="/web/verify" hx-target="#verificationResult" hx-indicator="#verifySpinner" class="space-y-4">
      <div>
        <label for="credentialInput" class="block text-xs font-semibold uppercase tracking-wider text-text-muted mb-2 font-mono">
          Public Credential Identifier
        </label>
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
          <div class="relative flex-1">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-subtle text-[22px] pointer-events-none">search</span>
            <input 
              type="text" 
              name="credential_public_id" 
              id="credentialInput" 
              required
              autocomplete="off"
              class="w-full h-12 pl-12 pr-4 rounded-xl bg-surface border border-border-focus font-mono text-sm text-white placeholder-text-subtle focus:border-brand focus:ring-1 focus:ring-brand transition-all outline-none"
              placeholder="e.g. CRD-2026-000001" 
              value="{{ sample_valid_id or '' }}" 
            />
          </div>
          <button 
            type="submit"
            class="h-12 px-6 bg-brand hover:bg-brand-hover text-white text-sm font-bold rounded-xl flex items-center justify-center gap-2 transition-all shadow-md active:scale-95 cursor-pointer shrink-0">
            <span class="material-symbols-outlined text-[18px]">verified</span>
            <span>Verify</span>
          </button>
        </div>
      </div>

      <!-- HTMX Progress Spinner: inside card, displayed only during request -->
      <div id="verifySpinner" class="htmx-indicator items-center justify-center gap-2 pt-2 text-brand font-mono text-xs">
        <span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span>
        <span>Checking credential...</span>
      </div>
    </form>
  </div>

  <!-- Dynamic Verification Result: exactly 24px below search card when populated, 0 height when empty -->
  <div id="verificationResult" class="empty:hidden"></div>
</div>
{% endblock %}
